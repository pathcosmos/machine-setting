# Profile: GPU Server
# gpu-workstation + server extras: Docker + NVIDIA Container Toolkit, monitoring stack,
# SMART monitoring, no auto-reboot / held kernel+driver upgrades, sleep disabled, GPU persistence fixes.
# For: an always-on single-node AI server (consumer or workstation GPU)

PACKAGE_GROUPS="core data web"
GPU_PACKAGES=true
INSTALL_NODE=true
INSTALL_JAVA=true

INSTALL_NVIDIA=true
NVIDIA_ENTERPRISE=false
NVIDIA_SYSTEM_TOOLS=true
NVIDIA_KERNEL_TUNING=true
NVIDIA_CONTAINER_TOOLKIT=true

INSTALL_SERVER=true

# vLLM inference server in its own venv (~/vllm-env). Set true to include it, or pass --vllm / --no-vllm.
INSTALL_VLLM=false
