# Machine Setting - Default Configuration
# Override in config/machine.conf (gitignored) for machine-specific settings

PYTHON_VERSION="3.12"
VENV_DEFAULT_PATH="$HOME/ai-env"
INSTALL_NODE=true
INSTALL_JAVA=true
NODE_VERSION="lts"
JAVA_VERSION="25"
UPDATE_CHECK_INTERVAL=86400    # 24 hours in seconds

# Package groups to install (space-separated)
PACKAGE_GROUPS="core data web"     # gpu/cpu auto-selected by hardware detection

# --- NVIDIA GPU Stack ---
INSTALL_NVIDIA=true                # Set false to skip entire NVIDIA stage
NVIDIA_DRIVER_VERSION=""           # empty = auto-detect recommended driver
NVIDIA_CUDA_VERSION=""             # empty = latest cuda-toolkit in the NVIDIA repo for this distro;
                                   # pin e.g. "13-5" or "12-6" in machine.conf (must exist in that distro's repo)
NVIDIA_OPEN_KERNEL="auto"         # auto | true | false (open vs proprietary kernel modules)
NVIDIA_ENTERPRISE=false            # true = install DCGM, Fabric Manager, GDS, peermem
NVIDIA_NO_DRIVER=false             # true = skip driver install (CUDA/cuDNN only)
NVIDIA_CONTAINER_TOOLKIT=true      # Install NVIDIA Container Toolkit (if Docker present)
NVIDIA_SYSTEM_TOOLS=true           # Install build-essential, cmake, numactl, hwloc, nvtop, etc.
NVIDIA_KERNEL_TUNING=true          # Apply sysctl/limits tuning for GPU workloads

# --- Cloud / Container Mode ---
CLOUD_MODE=false                   # true = skip all sudo/system-level operations
                                   # Auto-detected if no sudo available or running in container

# --- vLLM (LLM inference server; separate venv because it pins exact torch versions) ---
INSTALL_VLLM=false                 # true = install vLLM during setup (or: ./setup.sh --vllm)
VLLM_VERSION=""                    # empty = latest
VLLM_VENV_PATH="$HOME/vllm-env"

# --- Server extras (scripts/install-server.sh, ./setup.sh --server) ---
INSTALL_SERVER=false               # true = run server extras automatically at the end of setup.sh
SERVER_DOCKER=true                 # Docker Engine + Compose + NVIDIA Container Toolkit
SERVER_UPDATE_POLICY=true          # unattended-upgrades: never auto-reboot
SERVER_HOLD_KERNEL_NVIDIA=true     # exclude kernel + NVIDIA packages from automatic upgrades (update manually, together)
SERVER_DISK_HEALTH=true            # smartmontools / smartd
SERVER_MONITORING=true             # Prometheus + Grafana + node-exporter + DCGM exporter (Docker)
SERVER_DISABLE_SLEEP=true          # mask sleep/suspend/hibernate targets
SERVER_GPU_PERSIST=true            # run gpu-persist-fix.sh (PCIe/NVIDIA power management off)
MONITORING_BIND="127.0.0.1"        # address the monitoring ports bind to (use SSH tunnel; 0.0.0.0 = expose on LAN)

# --- Base tools (every machine, GPU or not; installed right after hardware detection) ---
INSTALL_BASE_TOOLS=true
BASE_TOOLS="btop"                  # space-separated package names (apt / dnf / brew)

# --- Locales (shell picks one per terminal: see shell/bashrc.d/20-env.sh) ---
INSTALL_LOCALES=true
LOCALE_REMOTE="ko_KR.UTF-8"        # SSH / terminal emulators / tmux
LOCALE_CONSOLE="en_US.UTF-8"       # direct tty on the machine (Linux console cannot draw Hangul)
