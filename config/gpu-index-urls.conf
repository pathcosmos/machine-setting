# PyTorch index URLs by CUDA version
# Format: CUDA_SUFFIX=URL
# detect-hardware.sh maps the system CUDA version (nvcc) to the nearest suffix at or below it,
# e.g. CUDA 13.5 -> cu132. Only list indexes that actually exist on download.pytorch.org.
# Verified 2026-11: cu132 (torch 2.15), cu130/cu126 (torch 2.14), cu128 (torch 2.11).
# cu124/cu121 are frozen at old torch releases (2.6 / 2.5) — legacy GPUs only.

cu132=https://download.pytorch.org/whl/cu132
cu130=https://download.pytorch.org/whl/cu130
cu128=https://download.pytorch.org/whl/cu128
cu126=https://download.pytorch.org/whl/cu126
cu124=https://download.pytorch.org/whl/cu124
cu121=https://download.pytorch.org/whl/cu121
cpu=https://download.pytorch.org/whl/cpu
